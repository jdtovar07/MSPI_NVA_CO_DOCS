site_name: MSPI · AUDITCYBER — Wiki del proyecto
site_description: Documentación técnica y funcional de la plataforma MSPI (Modelo de Seguridad y Privacidad de la Información).
# Ajustar al publicar en GitHub Pages:
# site_url: https://<org>.github.io/<repo>/
# Contenido real vive en la raíz del repo; docs/ solo contiene symlinks (sin duplicar Markdown).
docs_dir: docs
site_dir: site
use_directory_urls: false

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - tables
  - fenced_code
  - attr_list
  - md_in_html

# Excluir del build lo que no es documentación navegable
exclude_docs: |
  node_modules/
  graphify-out/
  site/
  .venv/
  CartasVoBo/
  Propuesta-grado/
  *.docx

# Informe graphify enlazado desde Grafo-Codigo.md (no necesita entrada propia en nav)
not_in_nav: |
  Documentacion-General/assets/graphify/GRAPH_REPORT.md

# Enlaces a carpetas / .docx / artefactos fuera del site no deben abortar el build
validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore
    not_found: warn

